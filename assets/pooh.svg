<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y brillo -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Degradados para Winnie the Pooh -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#5b8a8c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1b2f38" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="poohFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffd257" />
      <stop offset="70%" stop-color="#f3a712" />
      <stop offset="100%" stop-color="#d68305" />
    </radialGradient>

    <radialGradient id="poohMuzzle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffdf7a" />
      <stop offset="100%" stop-color="#f5af1e" />
    </radialGradient>

    <linearGradient id="poohShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#b51726" />
    </linearGradient>

    <!-- Degradados del Girasol -->
    <radialGradient id="sunflowerCenter" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5c3516" />
      <stop offset="65%" stop-color="#3b1f0a" />
      <stop offset="85%" stop-color="#824614" />
      <stop offset="100%" stop-color="#d48b11" />
    </radialGradient>

    <linearGradient id="sunflowerPetal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff9500" />
      <stop offset="45%" stop-color="#ffbe0b" />
      <stop offset="100%" stop-color="#fff176" />
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d5a27" />
      <stop offset="100%" stop-color="#4e8c3f" />
    </linearGradient>
  </defs>

  <!-- Halo de luz cálida -->
  <circle cx="160" cy="160" r="145" fill="url(#haloGlow)" />

  <!-- ================= CUERPO Y CABEZA DE WINNIE THE POOH ================= -->
  <g filter="url(#dropShadow)">
    
    <!-- Oreja Izquierda -->
    <circle cx="106" cy="74" r="22" fill="url(#poohFur)" />
    <circle cx="106" cy="74" r="14" fill="#d68305" opacity="0.35" />

    <!-- Oreja Derecha -->
    <circle cx="214" cy="74" r="22" fill="url(#poohFur)" />
    <circle cx="214" cy="74" r="14" fill="#d68305" opacity="0.35" />

    <!-- Cabeza -->
    <ellipse cx="160" cy="118" rx="64" ry="58" fill="url(#poohFur)" />

    <!-- Mejillas tiernas -->
    <ellipse cx="120" cy="136" rx="14" ry="9" fill="#ff758f" opacity="0.25" />
    <ellipse cx="200" cy="136" rx="14" ry="9" fill="#ff758f" opacity="0.25" />

    <!-- Hocico / Muzzle -->
    <ellipse cx="160" cy="132" rx="34" ry="24" fill="url(#poohMuzzle)" />

    <!-- Nariz adorable -->
    <ellipse cx="160" cy="122" rx="11" ry="8" fill="#2d1e15" />
    <ellipse cx="158" cy="120" rx="3.5" ry="2" fill="#ffffff" opacity="0.6" />

    <!-- Sonrisa dulce -->
    <path d="M 148 136 Q 160 146 172 136" fill="none" stroke="#4a2810" stroke-width="3" stroke-linecap="round" />

    <!-- Ojos felices -->
    <!-- Ojo izquierdo -->
    <ellipse cx="134" cy="108" rx="5" ry="7" fill="#2d1e15" transform="rotate(-4 134 108)" />
    <circle cx="132.5" cy="106" r="2" fill="#ffffff" />
    <!-- Ceja izquierda -->
    <path d="M 125 96 Q 134 91 142 95" fill="none" stroke="#5a3818" stroke-width="2.5" stroke-linecap="round" />

    <!-- Ojo derecho -->
    <ellipse cx="186" cy="108" rx="5" ry="7" fill="#2d1e15" transform="rotate(4 186 108)" />
    <circle cx="184.5" cy="106" r="2" fill="#ffffff" />
    <!-- Ceja derecha -->
    <path d="M 178 95 Q 186 91 195 96" fill="none" stroke="#5a3818" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cuello y Camiseta Roja Clásica de Pooh -->
    <path d="M 112 165 C 105 185, 96 225, 96 250 C 120 258, 200 258, 224 250 C 224 225, 215 185, 208 165 C 192 172, 128 172, 112 165 Z" fill="url(#poohShirt)" />
    <!-- Cuello de la camiseta -->
    <path d="M 128 166 Q 160 180 192 166" fill="none" stroke="#9d0208" stroke-width="3.5" stroke-linecap="round" />

    <!-- Tallo del girasol en sus manitas -->
    <path d="M 160 215 Q 155 260 148 295" fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Hoja del tallo -->
    <path d="M 155 260 Q 130 255 125 272 Q 142 278 153 268" fill="#4e8c3f" />

    <!-- Brazos y Patitas de Pooh abrazando el girasol -->
    <!-- Brazo izquierdo -->
    <path d="M 104 185 C 92 205, 105 235, 132 230 C 142 228, 146 218, 140 210 C 125 200, 115 185, 104 185 Z" fill="url(#poohFur)" />
    <!-- Brazo derecho -->
    <path d="M 216 185 C 228 205, 215 235, 188 230 C 178 228, 174 218, 180 210 C 195 200, 205 185, 216 185 Z" fill="url(#poohFur)" />

  </g>

  <!-- ================= EL GRAN GIRASOL AMARILLO LUMINOSO ================= -->
  <g transform="translate(160, 202)" filter="url(#dropShadow)">
    
    <!-- Pétalos traseros (32 pétalos en total con rotación) -->
    <!-- Capa 1: Pétalos exteriores ámbar -->
    <g>
      <!-- 16 pétalos exteriores -->
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(0)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(22.5)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(45)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(67.5)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(90)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(112.5)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(135)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(157.5)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(180)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(202.5)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(225)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(247.5)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(270)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(292.5)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(315)" />
      <path d="M 0 0 C -12 -22, -9 -48, 0 -58 C 9 -48, 12 -22, 0 0" fill="#e07a10" transform="rotate(337.5)" />
    </g>

    <!-- Capa 2: Pétalos principales amarillos dorados y luminosos (desfasados 11.25°) -->
    <g>
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(11.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(33.75)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(56.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(78.75)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(101.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(123.75)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(146.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(168.75)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(191.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(213.75)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(236.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(258.75)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(281.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(303.75)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(326.25)" />
      <path d="M 0 0 C -11 -20, -8 -45, 0 -54 C 8 -45, 11 -20, 0 0" fill="url(#sunflowerPetal)" transform="rotate(348.75)" />
    </g>

    <!-- Centro oscuro de semillas de girasol -->
    <circle cx="0" cy="0" r="25" fill="url(#sunflowerCenter)" />

    <!-- Textura de semillas y polen dorado -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#d48b11" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    <circle cx="0" cy="0" r="17" fill="none" stroke="#f6c445" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
    <circle cx="0" cy="0" r="4" fill="#ffd166" opacity="0.9" />

    <!-- Patitas de Pooh sujetando el centro del girasol -->
    <ellipse cx="-20" cy="8" rx="8" ry="6" fill="url(#poohFur)" transform="rotate(-15 -20 8)" />
    <ellipse cx="20" cy="8" rx="8" ry="6" fill="url(#poohFur)" transform="rotate(15 20 8)" />
  </g>

  <!-- Destellos mágicos / chispitas doradas alrededor -->
  <g fill="#ffd166" opacity="0.85">
    <path d="M 50 140 Q 56 140 56 134 Q 56 140 62 140 Q 56 140 56 146 Q 56 140 50 140" />
    <path d="M 260 120 Q 266 120 266 114 Q 266 120 272 120 Q 266 120 266 126 Q 266 120 260 120" />
    <path d="M 245 235 Q 249 235 249 231 Q 249 235 253 235 Q 249 235 249 239 Q 249 235 245 235" />
    <path d="M 72 230 Q 76 230 76 226 Q 76 230 80 230 Q 76 230 76 234 Q 76 230 72 230" />
  </g>
</svg>
